# Select this custom Blueprint path explicitly; no existing service is replaced.
services:
  - type: web
    name: omnisciente-staging
    runtime: docker
    plan: free
    region: virginia
    branch: main
    dockerfilePath: ./deploy/RenderStaging.Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /api/
    envVars:
      - key: APP_ENV
        value: staging
      - key: DB_NAME
        value: staging_omnisciente_render
      - key: APP_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DEMO_MODE
        value: 'false'
      - key: RUN_LEGACY_MIGRATIONS
        value: 'false'
      - key: MONGO_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_NAME
        value: Staging Administrator
      - key: ADMIN_PASSWORD_HASH
        sync: false
