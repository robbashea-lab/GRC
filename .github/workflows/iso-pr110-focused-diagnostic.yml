name: ISO PR110 focused timing diagnostic

on:
  push:
    branches: [codex/iso-pr110-focused-diagnostic-20261031]

permissions:
  contents: read

jobs:
  focused-observation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      CI: 'true'
    steps:
      - name: Establish the bounded work deadline before setup
        working-directory: ${{ runner.temp }}
        run: echo "ISO_DIAGNOSTIC_DEADLINE_MS=$(( $(date +%s%3N) + 720000 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - name: First attempt and lightweight harness checks only
        env:
          DIAG_OUTPUT: ${{ runner.temp }}/iso-pr110-focused
        run: |
          mkdir -p "$DIAG_OUTPUT"
          test "$GITHUB_RUN_ATTEMPT" = 1
          node --test scripts/iso-pr110-diagnostic/phase-logger.test.cjs scripts/iso-pr110-diagnostic/setup.test.cjs scripts/iso-pr110-diagnostic/run.test.cjs > "$DIAG_OUTPUT/preflight.log" 2>&1
          cat "$DIAG_OUTPUT/preflight.log"
      - name: One original suite with separate observation
        env:
          DIAG_OUTPUT: ${{ runner.temp }}/iso-pr110-focused
        run: node scripts/iso-pr110-diagnostic/run.cjs "$DIAG_OUTPUT"
      - name: Preserve every available result and partial observation
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: iso-pr110-focused-observation
          path: ${{ runner.temp }}/iso-pr110-focused/
          if-no-files-found: error
          retention-days: 7
