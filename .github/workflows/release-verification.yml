name: Release verification

on:
  pull_request:
    branches: [main, codex/brawndo-guided-assessor, codex/staging-signed-in-v3-20261124]
  push:
    branches: [codex/staging-signed-in-v3-20261124, codex/nordic-staging-ci-20261122, main, codex/cis-demo-data-refresh-20261028, codex/owner-only-client-creation-20261029, codex/visual-consistency-20261029, codex/soc2-program-modernization-20261030, codex/iso27001-program-modernization-20261031, codex/soc2-category-refinements-20261031, codex/soc2-cis-exact-parity-20261031, codex/iso27001-shared-program-20261031]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-tests:
    name: Frontend tests (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [ten-year, multi-framework, framework-five-year, '1', '2', '3']
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - name: Validate campaign accounting regressions
        run: node --test scripts/frontend-campaign.test.cjs scripts/frontend-runtime-reporter.test.cjs
      - name: Discover and execute exact assigned suites
        run: node scripts/frontend-campaign.cjs run '${{ matrix.shard }}' 'campaign/${{ matrix.shard }}'
        env:
          CI: 'true'
      - name: Preserve inventory and Jest results even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-campaign-${{ matrix.shard }}
          path: frontend/campaign/${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 7

  frontend-builds:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - name: Build authenticated Render application
        run: node scripts/staging.cjs
        env:
          CI: 'true'
      - name: Build isolated private Demo preview
        run: yarn build:preview
        env:
          CI: 'true'
      - name: Record authenticated browser test provenance
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/governara-browser-receipt"
          {
            printf 'Candidate commit: %s\n' "$CANDIDATE_SHA"
            printf 'Tested commit: %s\n' "$(git rev-parse HEAD)"
            printf 'Tested tree: %s\n' "$(git rev-parse 'HEAD^{tree}')"
            sha256sum public/visual-preview.html ../deploy/cloudflare/dist/{visual-preview.html,approved-v3-native.js}
          } > "$RUNNER_TEMP/governara-browser-receipt/provenance.txt"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cmp public/visual-preview.html ../deploy/cloudflare/dist/visual-preview.html
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install disposable browser test runtime
        run: |
          python -m pip install -r ../backend/requirements-runtime.txt mongomock-motor==0.0.36
          npm install --prefix "$RUNNER_TEMP/governara-browser-tools" --no-save --ignore-scripts playwright@1.62.1
          node "$RUNNER_TEMP/governara-browser-tools/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify authenticated GoverNara workflows
        shell: bash
        env:
          APPROVED_QA_FAST: '1'
          APPROVED_QA_RECEIPT: ${{ runner.temp }}/governara-browser-receipt/result.json
          NODE_PATH: ${{ runner.temp }}/governara-browser-tools/node_modules
        run: |
          node scripts/qa/approved-v3-native.cjs 2>&1 | tee "$RUNNER_TEMP/governara-browser-receipt/browser.log"
          node -e 'const result = require(process.env.APPROVED_QA_RECEIPT);
            if (result.result !== "pass" || result.revision !== process.env.GITHUB_SHA ||
                !result.cisReview || !result.cmmc || !result.linked || !result.reviewReport) process.exit(1)'
      - name: Preserve authenticated browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: governara-authenticated-browser
          path: ${{ runner.temp }}/governara-browser-receipt/
          if-no-files-found: error
          retention-days: 7

  frontend-coverage:
    if: ${{ always() }}
    needs: [frontend-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: frontend-campaign-*
          path: frontend/campaign-artifacts
      - name: Require complete successful exact-source campaign
        working-directory: frontend
        run: node scripts/frontend-campaign.cjs audit campaign-artifacts

  frontend:
    # Preserve the existing required check identity as a fail-closed aggregate.
    if: ${{ always() }}
    needs: [frontend-tests, frontend-builds, frontend-coverage]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every shard, exhaustive accounting, both builds and authenticated browser verification
        env:
          TEST_RESULT: ${{ needs.frontend-tests.result }}
          BUILD_RESULT: ${{ needs.frontend-builds.result }}
          COVERAGE_RESULT: ${{ needs.frontend-coverage.result }}
        run: test "$TEST_RESULT" = success && test "$BUILD_RESULT" = success && test "$COVERAGE_RESULT" = success

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install runtime and isolated-test dependencies
        run: python -m pip install -r backend/requirements-runtime.txt mongomock-motor==0.0.36 pytest==9.1.1 pytest-xdist==3.8.0 requests==2.34.2
      - name: Verify staging entrypoint and static hosting
        run: python -m unittest deploy.test_render_staging -v
      - name: Every classified offline suite
        # Preserve the fixed workers/gate budget; expose the active suite and hung-test stacks.
        run: python backend/tests/run_isolated.py -vv --python-stack-timeout=60

  backend-mongo:
    # Mongo 8.0 rejects Linux 6.19+: https://jira.mongodb.org/browse/SERVER-121912
    # The 22.04 runner currently uses kernel 6.8; retain the real Mongo persistence gate.
    runs-on: ubuntu-22.04
    # The independent persistence campaign must not consume the offline suite's budget.
    timeout-minutes: 30
    services:
      mongo:
        image: mongo:8.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 12
      # Snapshot transactions require a replica set; retain the standalone persistence gate.
      framework-reports:
        image: mongo:8.0
        command: mongod --replSet framework_reports_ci --bind_ip_all --port 27018
        ports: ['127.0.0.1:27018:27018']
        options: >-
          --health-cmd "mongosh --port 27018 --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 12
    steps:
      - name: Report hosted Mongo verification kernel
        run: uname -r
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install runtime and isolated-test dependencies
        run: python -m pip install -r backend/requirements-runtime.txt mongomock-motor==0.0.36 pytest==9.1.1 pytest-xdist==3.8.0 requests==2.34.2
      - name: Disposable Mongo persistence, recovery and authorization
        run: >-
          python backend/scripts/verify_mongo_recovery.py
          --mongo-url mongodb://127.0.0.1:27017
          --include-program-lifecycle --include-cis-ig2
          --include-remediation-tickets --include-cis-ig3-scope
          --include-cis-six-year --include-generic-saves --include-portfolio-reporting
          --include-policy-coverage --include-evidence-integrity
          --include-ai-onboarding
      - name: Native R4 preservation, recovery and authorization on disposable Mongo
        run: python backend/scripts/verify_r4_mongo.py --mongo-url mongodb://127.0.0.1:27017

      - name: Elect the isolated framework-report replica set
        shell: python
        run: |
          if not __debug__:
              raise RuntimeError('Snapshot qualification requires Python checks to remain enabled')
          from time import monotonic, sleep
          from pymongo import MongoClient
          from pymongo.errors import ConnectionFailure

          with MongoClient('mongodb://127.0.0.1:27018/?directConnection=true',
                           serverSelectionTimeoutMS=5000, connectTimeoutMS=5000, socketTimeoutMS=5000) as mongo:
              mongo.admin.command('replSetInitiate', {
                  '_id': 'framework_reports_ci',
                  'members': [{'_id': 0, 'host': '127.0.0.1:27018'}],
              })
              deadline = monotonic() + 60
              while monotonic() < deadline:
                  try:
                      hello = mongo.admin.command('hello')
                  except ConnectionFailure:
                      sleep(1)
                      continue
                  if hello.get('isWritablePrimary'):
                      assert hello.get('setName') == 'framework_reports_ci', hello
                      assert hello.get('logicalSessionTimeoutMinutes') is not None, hello
                      break
                  sleep(1)
              else:
                  raise RuntimeError('Framework-report replica set did not elect a session-capable primary')
      - name: Real framework-report snapshot isolation and authorization
        run: >-
          python -m pytest -c backend/pytest.ini
          backend/tests/test_framework_reports.py::FrameworkReportMongoSnapshotTests
          -vv --junitxml=framework-report-snapshot.xml
        env:
          FRAMEWORK_REPORT_TEST_MONGO: mongodb://127.0.0.1:27018/?replicaSet=framework_reports_ci
      - name: Require all three native snapshot checks without skips
        shell: python
        run: |
          if not __debug__:
              raise RuntimeError('Snapshot qualification requires Python checks to remain enabled')
          import xml.etree.ElementTree as ET

          result = ET.parse('framework-report-snapshot.xml').getroot()
          cases = result.findall('.//testcase')
          expected = {
              'test_real_transaction_concurrent_assessment_and_evidence_edits_use_one_snapshot',
              'test_real_snapshot_has_no_source_writes',
              'test_real_snapshot_rechecks_role_membership_enabled_program_and_session_fences',
          }
          assert len(cases) == 3 and {case.attrib['name'] for case in cases} == expected
          assert all(case.attrib['classname'].endswith('.FrameworkReportMongoSnapshotTests') for case in cases)
          assert not list(result.iter('skipped')) and not list(result.iter('failure')) and not list(result.iter('error'))
          suites = list(result.iter('testsuite'))
          assert suites and sum(int(suite.attrib['tests']) for suite in suites) == 3
          assert all(int(suite.get(field, '0')) == 0
                     for suite in result.iter('testsuite') for field in ('errors', 'failures', 'skipped'))


  image-audit:
    name: Staging image audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate image identity and complete inventory guards
        run: python .github/scripts/audit_images.py --self-check
      - name: Build and audit final runtime and retained frontend toolchain
        run: python .github/scripts/audit_images.py
      - name: Preserve raw findings, SBOMs, inventories and provenance
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-image-audit
          path: ${{ runner.temp }}/governara-image-audit/
          if-no-files-found: error
          retention-days: 7

  release-gate:
    name: Release gate
    if: ${{ always() }}
    needs: [frontend, backend, backend-mongo, image-audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require completed successful verification jobs
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          MONGO_RESULT: ${{ needs.backend-mongo.result }}
          IMAGE_AUDIT_RESULT: ${{ needs.image-audit.result }}
        run: test "$FRONTEND_RESULT" = success && test "$BACKEND_RESULT" = success && test "$MONGO_RESULT" = success && test "$IMAGE_AUDIT_RESULT" = success
