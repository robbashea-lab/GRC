name: Release verification

on:
  pull_request:
    branches: [main, codex/brawndo-guided-assessor]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-tests:
    name: Frontend tests (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [ten-year, multi-framework, '1', '2', '3']
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - name: Validate campaign accounting regressions
        run: node --test scripts/frontend-campaign.test.cjs
      - name: Discover and execute exact assigned suites
        run: node scripts/frontend-campaign.cjs run '${{ matrix.shard }}' 'campaign/${{ matrix.shard }}'
        env:
          CI: 'true'
      - name: Preserve inventory and Jest results even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-campaign-${{ matrix.shard }}
          path: frontend/campaign/${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 7

  frontend-builds:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - name: Build authenticated Render application
        run: node scripts/staging.cjs
        env:
          CI: 'true'
      - name: Build isolated private Demo preview
        run: yarn build:preview
        env:
          CI: 'true'

  frontend-coverage:
    if: ${{ always() }}
    needs: [frontend-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: frontend-campaign-*
          path: frontend/campaign-artifacts
      - name: Require complete successful exact-source campaign
        working-directory: frontend
        run: node scripts/frontend-campaign.cjs audit campaign-artifacts

  frontend:
    # Preserve the existing required check identity as a fail-closed aggregate.
    if: ${{ always() }}
    needs: [frontend-tests, frontend-builds, frontend-coverage]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every shard, exhaustive accounting and both builds
        env:
          TEST_RESULT: ${{ needs.frontend-tests.result }}
          BUILD_RESULT: ${{ needs.frontend-builds.result }}
          COVERAGE_RESULT: ${{ needs.frontend-coverage.result }}
        run: test "$TEST_RESULT" = success && test "$BUILD_RESULT" = success && test "$COVERAGE_RESULT" = success

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install runtime and isolated-test dependencies
        run: python -m pip install -r backend/requirements-runtime.txt mongomock-motor==0.0.36 pytest==9.1.1 pytest-xdist==3.8.0 requests==2.34.2
      - name: Every classified offline suite
        # Preserve the fixed workers/gate budget; expose the active suite and hung-test stacks.
        run: python backend/tests/run_isolated.py -vv --python-stack-timeout=60

  backend-mongo:
    # Mongo 8.0 rejects Linux 6.19+: https://jira.mongodb.org/browse/SERVER-121912
    # The 22.04 runner currently uses kernel 6.8; retain the real Mongo persistence gate.
    runs-on: ubuntu-22.04
    # The independent persistence campaign must not consume the offline suite's budget.
    timeout-minutes: 30
    services:
      mongo:
        image: mongo:8.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 12
    steps:
      - name: Report hosted Mongo verification kernel
        run: uname -r
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install runtime and isolated-test dependencies
        run: python -m pip install -r backend/requirements-runtime.txt mongomock-motor==0.0.36 pytest==9.1.1 pytest-xdist==3.8.0 requests==2.34.2
      - name: Disposable Mongo persistence, recovery and authorization
        run: >-
          python backend/scripts/verify_mongo_recovery.py
          --mongo-url mongodb://127.0.0.1:27017
          --include-program-lifecycle --include-cis-ig2
          --include-remediation-tickets --include-cis-ig3-scope
          --include-cis-six-year --include-generic-saves --include-portfolio-reporting
          --include-policy-coverage --include-evidence-integrity

  release-gate:
    name: Release gate
    if: ${{ always() }}
    needs: [frontend, backend, backend-mongo]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require completed successful verification jobs
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          MONGO_RESULT: ${{ needs.backend-mongo.result }}
        run: test "$FRONTEND_RESULT" = success && test "$BACKEND_RESULT" = success && test "$MONGO_RESULT" = success
