name: CIS operation trace diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cis-operation-trace-${{ github.ref }}
  cancel-in-progress: false

jobs:
  operation-trace:
    if: github.ref == 'refs/heads/codex/cis-operation-trace-20261105'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend
        shell: bash
    env:
      CI: 'true'
      TZ: UTC
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Require the frozen base and exactly three diagnostic-only changes
        working-directory: .
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/cis-operation-trace"
          printf 'CIS_OPERATION_TRACE_DIR=%s\n' "$out" >> "$GITHUB_ENV"
          mkdir -p "$out"
          base=261cabae2707ceb172c517b60afb75d216c63e2d
          git rev-parse HEAD > "$out/diagnostic-head.txt"
          git rev-parse "$base^{tree}" > "$out/base-tree.txt"
          git diff --name-only "$base" HEAD > "$out/changed-paths.txt"
          test "$(wc -l < "$out/changed-paths.txt")" -eq 3
          while IFS= read -r file; do
            case "$file" in
              frontend/src/preview/multiFrameworkLifecycle.test.js|frontend/src/testUtils/cisLifecycleOperationTrace.cjs|.github/workflows/release-verification.yml) ;;
              *) echo "Unexpected source change: $file"; exit 1 ;;
            esac
          done < "$out/changed-paths.txt"
          git diff --exit-code "$base" HEAD -- . ':!frontend/src/preview/multiFrameworkLifecycle.test.js' ':!frontend/src/testUtils/cisLifecycleOperationTrace.cjs' ':!.github/workflows/release-verification.yml' > "$out/native-source-diff.txt"
          git show "$base:frontend/src/preview/multiFrameworkLifecycle.test.js" > "$out/original-test.git-blob.js"
          test "$(git rev-parse "$base:frontend/src/preview/multiFrameworkLifecycle.test.js")" = af88d5a9ba2fc80be73e1b5099e86cfd3a443af3
          echo '4054639134a5d68d77eedf66de8b9963bab70e07d130bee5c67b8ce5705d4dd4  '"$out/original-test.git-blob.js" | sha256sum -c -
          echo 'a3233e7e596a28a27f92c8f8bb9c0bbec5a89d337187782cdb9b844f76bd9fb4  frontend/src/preview/multiFrameworkLifecycle.test.js' | sha256sum -c -
          echo '7447533fba2fdd4fb811c49770ec3232b87b58b0f8e07935a94632c6dbc2dddc  frontend/src/testUtils/cisLifecycleOperationTrace.cjs' | sha256sum -c -
          sha256sum frontend/yarn.lock frontend/package.json frontend/craco.config.js frontend/scripts/frontend-campaign.cjs > "$out/control-file-hashes.txt"
          uname -a > "$out/runner-kernel.txt"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
      - run: corepack enable
      - name: Install the unchanged frozen dependency graph
        timeout-minutes: 3
        run: |
          set -euo pipefail
          test "$(node --version)" = v22.23.4
          test "$(yarn --version)" = 1.22.22
          node --version > "$CIS_OPERATION_TRACE_DIR/node-version.txt"
          yarn --version > "$CIS_OPERATION_TRACE_DIR/yarn-version.txt"
          yarn install --frozen-lockfile
      - name: One original multi-framework campaign, unchanged case deadline
        run: |
          set -euo pipefail
          out="$CIS_OPERATION_TRACE_DIR"
          for flag in REACT_APP_PREVIEW REACT_APP_DEMO_ONBOARDING_CLIENT REACT_APP_CIS_BRAWNDO_CANDIDATE_QA REACT_APP_CIS_INITECH_CANDIDATE_QA REACT_APP_CIS_KRUSTY_CANDIDATE_QA FRAMEWORK_LIFECYCLE_EXPORT_DIR NODE_OPTIONS NODE_V8_COVERAGE; do
            test -z "${!flag:-}" || { echo "Unexpected inherited diagnostic option: $flag"; exit 1; }
          done
          set +e
          /usr/bin/time -v -o "$out/whole-command-resource.txt" timeout --signal=TERM --kill-after=10s 450s node scripts/frontend-campaign.cjs run multi-framework "$out/campaign" 2>&1 | tee "$out/command.log"
          statuses=("${PIPESTATUS[@]}")
          status=${statuses[0]}
          tee_status=${statuses[1]}
          set -e
          printf '%s\n' "$status" > "$out/command-exit-code.txt"
          printf '%s\n' "$tee_status" > "$out/command-log-exit-code.txt"
          test "$tee_status" -eq 0 || { echo 'Raw command log write failed; preserve failure without relaunch'; exit 1; }
          test -s "$out/operation-trace.json" || { echo 'Diagnostic trace missing; preserve failure without relaunch'; exit 1; }
          exit "$status"
      - name: Preserve final tracked-source integrity
        if: ${{ always() }}
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p "$CIS_OPERATION_TRACE_DIR"
          git status --porcelain --untracked-files=no > "$CIS_OPERATION_TRACE_DIR/final-tracked-status.txt"
          sha256sum frontend/src/preview/multiFrameworkLifecycle.test.js frontend/src/testUtils/cisLifecycleOperationTrace.cjs > "$CIS_OPERATION_TRACE_DIR/final-diagnostic-source-hashes.txt"
          git diff --quiet HEAD --
      - name: Preserve the single attempt, including failure and incomplete spans
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cis-operation-trace-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cis-operation-trace/
          if-no-files-found: error
          retention-days: 7
