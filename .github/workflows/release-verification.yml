name: Release verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    # Existing ten-year simulation has a 30-minute hook budget, plus other tests/builds.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn test --watchAll=false --runInBand
        env:
          CI: 'true'
      - name: Build authenticated Render application
        run: node scripts/staging.cjs
        env:
          CI: 'true'
      - name: Build isolated private Demo preview
        run: yarn build:preview
        env:
          CI: 'true'

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mongo:
        image: mongo:8.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install runtime and isolated-test dependencies
        run: python -m pip install -r backend/requirements-runtime.txt mongomock-motor==0.0.36 pytest==9.1.1 pytest-xdist==3.8.0 requests==2.34.2
      - name: Every classified offline suite
        run: python backend/tests/run_isolated.py
      - name: Disposable Mongo persistence, recovery and authorization
        run: >-
          python backend/scripts/verify_mongo_recovery.py
          --mongo-url mongodb://127.0.0.1:27017
          --include-program-lifecycle --include-cis-ig2
          --include-remediation-tickets --include-cis-ig3-scope
          --include-cis-six-year --include-generic-saves

  release-gate:
    name: Release gate
    if: ${{ always() }}
    needs: [frontend, backend]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require completed successful verification jobs
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
        run: test "$FRONTEND_RESULT" = success && test "$BACKEND_RESULT" = success
