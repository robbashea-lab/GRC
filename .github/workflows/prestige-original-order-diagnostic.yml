name: Prestige original-order diagnostic (not qualification)

# This temporary branch is created once after the pinned artifacts are reviewed.
# No normal release workflow, deployment or default-branch change is involved.
on: create

permissions:
  contents: read

jobs:
  original-order:
    if: github.event.ref_type == 'branch' && github.event.ref == 'codex/prestige-original-order-f6a15b8d-20261108'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - name: Original campaign accounting regressions
        run: node --test scripts/frontend-campaign.test.cjs scripts/frontend-runtime-reporter.test.cjs
      - name: Diagnostic ordering harness checks (no application execution)
        run: node scripts/prestige-original-order/static-self-check.cjs
      - name: One original-order complete shard 3
        run: node scripts/prestige-original-order/run.cjs
        env:
          CI: 'true'
      - name: Preserve all diagnostic results even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prestige-original-order-diagnostic
          path: frontend/original-order-output/
          if-no-files-found: error
          retention-days: 14
